<rect x="784.0" y="377.5" width="44" height="27.499999999999996" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="806.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.50</text>
<rect x="904.0" y="381.0598595093566" width="44" height="23.94014049064341" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="926.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.44</text>
<rect x="1024.0" y="384.15889721048205" width="44" height="20.841102789517972" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="1046.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.38</text>
<rect x="1144.0" y="386.8567662268727" width="44" height="18.143233773127292" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="1166.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.33</text>
<rect x="1264.0" y="389.20539761879076" width="44" height="15.794602381209229" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="1286.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.29</text>
<text x="1356" y="375" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">… to t+29</text>
<text x="1356" y="395" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">weight 0.02</text>
<rect x="150" y="450" width="700" height="78" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
<text x="168" y="480" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">label for the APPROACH at t  =  Σ  γ^j · K(t+j)  over 30 cycles</text>
<text x="168" y="508" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">here  =  (-0.29) × 0.44  =  -0.13 hunger        (an immediate-only label would be 0)</text>
<rect x="890" y="450" width="670" height="78" rx="8" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="908" y="476" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Why 30: after 6 half-lives (5 cycles each) the weight is 0.02, so more cycles add nothing.</text>
<text x="908" y="500" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">No episode cut: a timeout cannot zero the APPROACH credit (the p117 flaw).</text>
<text x="908" y="520" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">Value is under the behaviour that followed (a3_kal + exploration), not the best possible.</text>
<text x="40" y="590" font-size="20" font-weight="700" fill="#2f6fb0" text-anchor="start">B  The model: one row in, expected change in each drive out</text>
<rect x="40" y="620" width="300" height="58" rx="8" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="56" y="645" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">candidate percept</text>
<text x="56" y="666" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">type, distance, bearing, contact</text>
<line x1="340" y1="649" x2="420" y2="719" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="690" width="300" height="58" rx="8" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="56" y="715" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">drives h</text>
<text x="56" y="736" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">hunger, sleep, pain, tedium</text>
<line x1="340" y1="719" x2="420" y2="719" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="760" width="300" height="58" rx="8" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="56" y="785" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">action</text>
<text x="56" y="806" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">APPROACH, EAT, AVOID, …</text>
<line x1="340" y1="789" x2="420" y2="719" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="425" y="675" width="170" height="90" rx="8" fill="#e4eefb" stroke="#2f6fb0" stroke-width="2"/>
<text x="510" y="715" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">encoders</text>
<text x="510" y="738" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">z(percept), z(h)</text>
<line x1="595" y1="720" x2="660" y2="720" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="665" y="640" width="230" height="160" rx="8" fill="#e4eefb" stroke="#2f6fb0" stroke-width="2"/>
<text x="780" y="672" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">critic: 5 heads</text>
<rect x="690" y="692" width="30" height="46" rx="5" fill="#fff" stroke="#2f6fb0" stroke-width="1.5"/>
<rect x="728" y="692" width="30" height="46" rx="5" fill="#fff" stroke="#2f6fb0" stroke-width="1.5"/>
<rect x="766" y="692" width="30" height="46" rx="5" fill="#fff" stroke="#2f6fb0" stroke-width="1.5"/>
<rect x="804" y="692" width="30" height="46" rx="5" fill="#fff" stroke="#2f6fb0" stroke-width="1.5"/>
<rect x="842" y="692" width="30" height="46" rx="5" fill="#fff" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="780" y="768" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">trained on the labels of A</text>
<text x="780" y="788" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">bootstrap by seed</text>
<line x1="895" y1="690" x2="990" y2="675" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<line x1="895" y1="750" x2="990" y2="765" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="995" y="630" width="330" height="80" rx="8" fill="#e2f3ea" stroke="#2d8a5b" stroke-width="2"/>
<text x="1010" y="660" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">μ: expected change per drive</text>
<text x="1010" y="684" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">(mean of the 5 heads, 4 values)</text>
<rect x="995" y="728" width="330" height="80" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="1010" y="758" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">SE: do the 5 heads disagree?</text>
<text x="1010" y="782" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">σ: spread of single outcomes</text>
<rect x="1350" y="630" width="210" height="178" rx="8" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1455" y="660" font-size="15" font-weight="700" fill="#52606d" text-anchor="middle">optional</text>
<text x="1455" y="684" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">predictor ẑ(t+1)</text>
<text x="1455" y="710" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">only for beam search;</text>
<text x="1455" y="728" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">the plan's #135 ablation</text>
<text x="1455" y="746" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">tests if it helps</text>
<text x="40" y="860" font-size="20" font-weight="700" fill="#2f6fb0" text-anchor="start">C  At run time: every cycle, all candidates scored in one batch, then the arbiter decides</text>
<rect x="40" y="890" width="320" height="230" rx="8" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="56" y="918" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">candidates in view</text>
<text x="56" y="952" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">APPROACH green apple</text>
<text x="344" y="952" font-size="16" font-weight="700" fill="#2d8a5b" text-anchor="end">0.07</text>
<text x="56" y="986" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">EAT red apple</text>
<text x="344" y="986" font-size="16" font-weight="700" fill="#2d8a5b" text-anchor="end">0.13</text>
<text x="56" y="1020" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">AVOID cactus</text>
<text x="344" y="1020" font-size="16" font-weight="700" fill="#2d8a5b" text-anchor="end">0.00</text>
<text x="56" y="1054" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">WANDER</text>
<text x="344" y="1054" font-size="16" font-weight="700" fill="#2d8a5b" text-anchor="end">0.01</text>
<text x="56" y="1088" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">… 10 to 25 in total</text>
<text x="344" y="934" font-size="13" font-weight="700" fill="#52606d" text-anchor="end">Q</text>
<text x="56" y="1112" font-size="12" font-weight="400" fill="#52606d" text-anchor="start" font-style="italic">Q = V(μ | current need): drive reduction, illustrative</text>
<line x1="360" y1="1005" x2="440" y2="1005" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<text x="400" y="990" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">1 call</text>
<rect x="445" y="950" width="190" height="110" rx="8" fill="#e4eefb" stroke="#2f6fb0" stroke-width="2"/>
<text x="540" y="988" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">model B</text>
<text x="540" y="1012" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">→ Q, SE, σ for each</text>
<text x="540" y="1034" font-size="13" font-weight="400" fill="#52606d" text-anchor="middle">far from training → abstain</text>
<line x1="635" y1="1005" x2="715" y2="1005" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="720" y="890" width="840" height="230" rx="8" fill="#fff" stroke="#1f2933" stroke-width="2"/>
<text x="740" y="920" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">Arbiter: cheapest controller first, stop when one is decisive</text>
<rect x="745" y="945" width="240" height="100" rx="8" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="759" y="976" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">1 operant (Kalman)</text>
<text x="759" y="1000" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">cost 0</text>
<text x="759" y="1022" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">per object, what to do</text>
<line x1="985" y1="995" x2="1015" y2="995" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1015" y="945" width="240" height="100" rx="8" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="1029" y="976" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">2 episodic memory</text>
<text x="1029" y="1000" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">needs efficiency e ≥ 0.3</text>
<text x="1029" y="1022" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">similar past episodes</text>
<line x1="1255" y1="995" x2="1285" y2="995" stroke="#52606d" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1285" y="945" width="240" height="100" rx="8" fill="#e2f3ea" stroke="#2d8a5b" stroke-width="3"/>
<text x="1299" y="976" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">3 PLANNER (new)</text>
<text x="1299" y="1000" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">needs e ≥ 0.7</text>
<text x="1299" y="1022" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">population-trained critic</text>
<text x="740" y="1080" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Each reports Q, SE, σ in the same unit. Thompson draw among candidates of the deciding controller → chosen action.</text>
<text x="740" y="1104" font-size="15" font-weight="400" fill="#52606d" text-anchor="start">Arms: planner alone · a3_kal + planner · a3_kal + shuffled planner ("any prior" control).</text>
</svg>