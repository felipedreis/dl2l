<text x="40" y="158" font-size="16" font-weight="600" fill="#52606d" text-anchor="start">action</text>
<text x="40" y="249" font-size="16" font-weight="600" fill="#52606d" text-anchor="start">hunger K</text>
<text x="40" y="269" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">(per act)</text>
<line x1="150" y1="235" x2="1342" y2="235" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="206.0" y="231" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">0</text>
