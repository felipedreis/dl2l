<text x="1046.0" y="231" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">0</text>
<text x="1166.0" y="231" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">0</text>
<text x="1286.0" y="231" font-size="14" font-weight="400" fill="#52606d" text-anchor="middle">0</text>
<text x="926.0" y="331" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle" font-style="italic">(illustrative)</text>
<text x="40" y="369" font-size="16" font-weight="600" fill="#52606d" text-anchor="start">weight γ^j</text>
<text x="40" y="389" font-size="14" font-weight="400" fill="#52606d" text-anchor="start">γ = 2^(-1/5)</text>
<rect x="184.0" y="350.0" width="44" height="55.0" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="206.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">1.00</text>
<rect x="304.0" y="357.11971901871317" width="44" height="47.88028098128683" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="326.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.87</text>
<rect x="424.0" y="363.31779442096405" width="44" height="41.682205579035944" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
<text x="446.0" y="425" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">0.76</text>
<rect x="544.0" y="368.7135324537454" width="44" height="36.28646754625459" rx="3" fill="#b7791f" stroke="#b7791f" stroke-width="1"/>
