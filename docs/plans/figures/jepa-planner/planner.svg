<text x="1166.0" y="120" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">t+8</text>
<rect x="1230" y="130" width="112" height="44" rx="8" fill="#eef1f4" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="1286.0" y="158" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">WANDER</text>
