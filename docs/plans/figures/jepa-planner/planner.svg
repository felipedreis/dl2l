<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="1600" height="1180" fill="#fff"/>
<text x="40" y="46" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start">JEPA planner: what it is trained on, what it predicts, how the arbiter uses it</text>
<text x="40" y="100" font-size="20" font-weight="700" fill="#2f6fb0" text-anchor="start">A  One training row: the label for an APPROACH step is what follows it, not what it does itself</text>
