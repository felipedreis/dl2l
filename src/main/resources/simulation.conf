simulation {
  holders = 1
  noUI = false
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = true
  creatureSettings = []

  worldObjectSettings = []

  worldSize = {
    width = 800, height = 600
  }

  learningSettings {
    circadianEnabled    = true
    consolidationEnabled = true
    # A set, not a sequence: the chain order is always LearningSettings.MASTER_FILTER_ORDER.
    # Listed in that order here so the file reads as the chain it produces.
    enabledFilters      = [TARGET_DISTANCE, MEMORY, AFFORDANCE, WORLD_MODEL, RANDOM]
  }
}