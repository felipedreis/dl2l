object-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"

  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 20
  }
  throughput = 10
}

bd-dispatcher {
  type = PinnedDispatcher
  mailbox-type = "br.cefetmg.lsi.l2l.common.ComponentMailbox"
  executor = "thread-pool-executor"

  # Bounds how many top-level queued messages BDActor's mailbox merges into a single
  # dequeue()/transaction (a whole PersistenceState[] array counts as one, never split -
  # see ComponentMessageQueue). Without this, sustained backlog under real load caused a
  # runaway feedback loop (bigger backlog -> bigger single transaction -> EclipseLink's
  # UnitOfWork identity map holding ~965K entities simultaneously) that OOM'd the JVM - see
  # docs/plans/issue-77-bdactor-oom-fix.md. 500 is a starting value, not a tuned optimum.
  #
  # Issue #79 measured this NOT to be the binding constraint on drain throughput: raising
  # both this and max-states-per-batch 10x (5000/20000) produced no measurable change in
  # sustained persist rate (~17-18K states/s either way) against multi-million-state
  # backlogs produced by the post-#76/#78 cognitive-cycle throughput - the bottleneck is
  # raw Postgres write throughput, not transaction count/overhead, so the fix there was a
  # more generous Holder.java Flush timeout instead (see its comment). Left at the original,
  # OOM-battle-tested value.
  max-batch-size = 500

  # Independent, redundant cap on total flattened states (not envelopes) per transaction -
  # added after a live re-verification of the fix above still OOM'd once: a single dequeue()
  # handed BDActor a 2.19M-state batch despite max-batch-size=500, root cause not conclusively
  # identified (see docs/plans/issue-77-bdactor-oom-fix-followup.md). This bounds the thing
  # that actually matters with its own separate counter, so it still holds even if whatever
  # defeated the envelope cap above recurs. Raised 2000 -> 8192 alongside the W4 producer-side
  # persist() buffering (docs/plans/arrow-ipc-write-path.md): with states arriving pre-batched
  # into 256-state arrays, 2000 only allowed ~8 envelopes/dequeue, and Arrow appends (unlike the
  # old Parquet row-group encode) are cheap enough not to need as tight a per-transaction cap.
  max-states-per-batch = 8192
}

wm-dispatcher {
  type = PinnedDispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 1
  }
}

collision-dispatcher {
  mailbox-type = "br.cefetmg.lsi.l2l.cluster.CollisionDetectorPriorityMailbox"

  # docs/plans/arrow-ipc-write-path.md, W5b: previously configured only the priority
  # mailbox and silently inherited actor.default-dispatcher's fork-join settings - explicit
  # now, sized the same as cluster-dispatcher below (dedicated, isolated capacity, not
  # work-stealing fork-join pool contention under a controlled cpuset).
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 2
  }
}

# docs/plans/arrow-ipc-write-path.md, W5b: dedicated fixed-size pool for SimulationManager
# and Holder (see Main.java) - fork-join's work-stealing suits many short CPU-bound tasks
# with idle cores to steal from; under a controlled cpuset (CCAD) it adds contention and
# gives zero isolation between cluster liveness (handshakes/heartbeats/the Finish protocol)
# and creature load. Directly targets the observed livelock symptom (manager 15s handshake
# timeout, "Up seen=false") under CPU/GC pressure.
cluster-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 2
  }
}

component-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"

  # Explicit, CPU-bound-appropriate sizing. Left unset, this silently inherited
  # akka.actor.default-dispatcher's fork-join defaults (parallelism-factor = 3.0,
  # tuned for I/O-bound dispatchers) - on CCAD's 6-CPU-per-trial cgroup slice that
  # computed to 18 worker threads per JVM role, confirmed live via thread dump and
  # the JVM's own system_cpu_count=6 metric. PartialAppraisal/HomeostaticRegulation/
  # Valuation/EmotionalSystemActor/MemorySystemActor/OperantConditioningActor etc. do
  # no I/O blocking in their hot path, so 3x oversubscription only added contention,
  # compounding across 3 JVM roles x up to 5 co-located trials per CCAD node into
  # bursty scheduling stalls (see docs/plans/ccad-dispatcher-parallelism-fix.md).
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 1.0
    parallelism-max = 6
  }
  mailbox-type = "br.cefetmg.lsi.l2l.common.ComponentMailbox"
}

akka.actor.deployment {
  "/holder/object-*" {
    dispatcher = object-dispatcher
  }
}


akka {
  loglevel = "INFO"
  # licenseKey = "3CecWl2jg6z8m1nVtGXu408QnXHNFiTsr8QnaOmUsbcy4q7y8WsPaoX4osrm0xdaSL5G68tZsT5960FybRsWYlhZ2mN4vLKLxf60cbKekKbI7ZIFIS58gS8Xh0BJURKSd8rMGWl2k1LMDHB0NPg7rMZGFj554mA8eMtuMFXY"

  actor {
    provider = "akka.cluster.ClusterActorRefProvider"
    #the supervisorStrategy used by the "/user" guardian actor
    guardian-supervisor-strategy = "akka.actor.StoppingSupervisorStrategy"

    #definindo serializer mais eficiente que o padrao java
    #serializers.java = "com.romix.akka.serialization.kryo.KryoSerializer"

  }

  # Left unconfigured, this used Akka's built-in fork-join defaults
  # (parallelism-factor = 3.0, tuned for I/O-bound work) - on CCAD's 6-CPU-per-trial
  # cgroup slice that computed to 18 worker threads per JVM role, confirmed live via
  # thread dump. See component-dispatcher above and
  # docs/plans/ccad-dispatcher-parallelism-fix.md for the full investigation. Kept a
  # bit more headroom here than component-dispatcher since this pool also serves
  # cluster/remote/system machinery.
  actor.default-dispatcher {
    fork-join-executor {
      parallelism-min = 2
      parallelism-factor = 1.0
      parallelism-max = 8
    }
  }

  remote {
    maximum-payload-bytes =  30000000 bytes
    netty.tcp {
      message-frame-size =  30000000b
      send-buffer-size =  30000000b
      receive-buffer-size =  30000000b
      maximum-frame-size = 30000000b
    }
    log-remote-lifecycle-events = off
  }

  cluster {
    seed-nodes = [
      "akka.tcp://l2l@localhost:2551",	#creatholder=
      #"akka.tcp://l2l@10.1.255.219:2550",
      #"akka.tcp://l2l@10.1.255.218:2550",
    ]

    min-nr-of-members = 2
  }
  version = 2.5.32
}
