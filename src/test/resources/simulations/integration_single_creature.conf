// Integration-test world (issue #85). One creature, one holder, a small ring of fruit,
// on a world small enough that the creature is essentially always within sensory range of
// something - which is the condition under which the pre-#85 detector-driven cycles were
// most numerous, so it is the condition the cycle-rate assertions need.
//
// learningSettings deliberately omits WORLD_MODEL: nothing here needs the species model,
// and leaving it out keeps the tests hermetic (no DJL/PyTorch native-runtime download) and
// fast. See CreatureActor.worldModelInUse().
simulation {
  holders = 1
  noUI = true
  reposition = true

  worldSize = {
    width = 400, height = 400
  }

  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"

  creatureSettings = [{
    quantity = 1
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 25
  }]

  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = ["TARGET_DISTANCE", "AFFORDANCE", "RANDOM"]
  }
}
