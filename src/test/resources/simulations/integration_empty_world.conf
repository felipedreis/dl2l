// Integration-test world (issue #85): one creature, nothing to perceive.
//
// Two properties are asserted against this world. First, liveness - a creature with an
// empty sensory field must still cognize, metabolize and eventually die, which is exactly
// the guarantee the removed heartbeat used to provide and which now rests on the creature's
// own scheduler. Second, rate independence - cognition here must run at the same rate as in
// the fruit-filled world, because the collision detector's replies are no longer what drives
// a cycle. Before issue #85 the two differed by roughly an order of magnitude.
//
// `reposition` is irrelevant with no objects but the key is required by Simulation.
simulation {
  holders = 1
  noUI = true
  reposition = false

  worldSize = {
    width = 400, height = 400
  }

  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"

  creatureSettings = [{
    quantity = 1
  }]

  worldObjectSettings = []

  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = ["TARGET_DISTANCE", "AFFORDANCE", "RANDOM"]
  }
}
