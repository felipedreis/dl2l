simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 5
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  # Repositioning OFF, same as p59 calibration, so this run is directly comparable
  # to the pre-#76 baseline in docs/reports/p59_batching_fix_report.md (3 creatures,
  # same world/food sizing). maxRuntimeMinutes cut to 5 since issue #79 predicts
  # creatures now starve in ~10-35s.
  reposition = false

  creatureSettings = [{
    quantity = 3
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 500
  }, {
    objectType = "GREEN_APPLE"
    quantity = 500
  }]

  worldSize = {
    width = 800, height = 600
  }

  # Issue #79 diagnostic: measure current (post-#76/#78) cognitive-cycle rate and
  # lifespan against unscaled Constants.java, to compute the rescale factor S.
  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, MEMORY, RANDOM]
    expectancyEnabled      = true
    expectancyMode         = DISCRETE
    neuromodulationEnabled = true
    actionTendencyEnabled  = false
    orexinEnabled          = true
    endocrineEnabled       = true
  }
}
