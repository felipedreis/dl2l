# Mapa (2009) §6.4 replication world — issue #84.
#
# Her setup: 12 red apples, 18 green apples and 25 balls (55 objects), randomly placed,
# one agent, and NO replenishment — an object is destroyed when interacted with, so the
# world depletes over the session. The measured quantity is the interval between
# successive interactions, for the first 10 of them.
#
# Two deviations, both forced and both documented in the report:
#   * The 25 balls are GRAY_APPLE (caloricValue 0). We have no toy object, and PLAY/TOUCH
#     interactions are never persisted (Mouth only writes MouthInteractionState for
#     EnergeticStimulus), so only EAT is counted. We therefore do not reproduce her
#     tedium-regulating play, which she cites as the cause of Fig. 47's oscillation.
#   * She does not state her world size. 638x534 is Campos's 860x720 scaled by
#     sqrt(55/100), which matches his object density exactly (6194 vs 6192 px^2 per
#     object) while preserving the aspect ratio. Density is what drives the interval, and
#     Campos is the only one of the two who published a number.
#
# maxRuntimeMinutes is a safety net, not part of the protocol: reaching 10 interactions
# should take far less. A trial that hits it is a calibration failure, not a data point.
#
# Arm L_mem: Adds the MEMORY filter. Note that engrams still FORM in the *_nomem
# arms (MemorySystemActor is created unconditionally, CreatureActor:132) — only their
# use differs, which makes formation a matched control across the pair.

simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 60
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = false

  creatureSettings = [{
    quantity = 1
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 12
  }, {
    objectType = "GREEN_APPLE"
    quantity = 18
  }, {
    objectType = "GRAY_APPLE"
    quantity = 25
  }]

  worldSize = {
    width = 638, height = 534
  }

  # Legacy-minimal: everything Mapa (2009) and Campos (2015) did not have is off, so a
  # mismatch against their figures is attributable to the core architecture rather than to
  # one of six later subsystems. No WORLD_MODEL either — neither source had one.
  learningSettings {
    circadianEnabled       = false
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, MEMORY, RANDOM]
    expectancyEnabled      = false
    neuromodulationEnabled = false
    actionTendencyEnabled  = false
    orexinEnabled          = false
    endocrineEnabled       = false
  }
}
