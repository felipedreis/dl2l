simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 5
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = false

  creatureSettings = [{
    quantity = 1
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 500
  }, {
    objectType = "GREEN_APPLE"
    quantity = 500
  }]

  worldSize = {
    width = 800, height = 600
  }

  # Throwaway diagnostic (issue #79): isolate whether BDActor's throughput collapse under
  # Phase A's rescaled Constants.java is caused by cross-creature CPU contention (3
  # concurrent creatures) or is a raw ceiling that manifests even with 1.
  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, MEMORY, RANDOM]
    expectancyEnabled      = true
    expectancyMode         = DISCRETE
    neuromodulationEnabled = true
    actionTendencyEnabled  = false
    orexinEnabled          = true
    endocrineEnabled       = true
  }
}
