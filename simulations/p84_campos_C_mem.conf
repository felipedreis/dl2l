# Campos et al. (2015) §V replication world — issue #84.
#
# His setup, used verbatim: 100 fruits (20 red, 20 green, 60 gray) in an 860x720 world,
# one agent, each consumed fruit replaced by a same-kind fruit at a random position
# (SimulationManager's Repose handler, i.e. reposition = true with no delay). Runs to
# death. The measured quantities are the cumulative count of actions per selection
# criterion and the lifetime.
#
# His visual field is a 150px radius at 70 degrees; our DEFAULT_VISION_FIELD_RADIUS is
# also 150, though our opening adapts in [50, 150] degrees rather than being fixed.
#
# maxRuntimeMinutes is a safety net so one runaway trial cannot stall the campaign. The
# pilot measures the real distribution; if the memory arms bind against it we reduce n
# rather than truncate, since a censored lifetime would corrupt the survival comparison.
#
# Arm C_mem: Adds the MEMORY filter under the current subsystem stack.

simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 90
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = true

  creatureSettings = [{
    quantity = 1
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 20
  }, {
    objectType = "GREEN_APPLE"
    quantity = 20
  }, {
    objectType = "GRAY_APPLE"
    quantity = 60
  }]

  worldSize = {
    width = 860, height = 720
  }

  # Current default stack (matches the 20260717_memory_vs_wm baseline), minus WORLD_MODEL.
  # Paired with the legacy-minimal arms this answers whether the newer subsystems break the
  # match with the published behaviour.
  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, MEMORY, RANDOM]
    expectancyEnabled      = true
    expectancyMode         = DISCRETE
    neuromodulationEnabled = true
    actionTendencyEnabled  = true
    orexinEnabled          = true
    endocrineEnabled       = true
  }
}
