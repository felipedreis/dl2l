simulation {
  holders = 1
  noUI = true

  # Bounded, predictable death rather than open-ended survival: no food respawn, and a
  # small enough supply that a creature reliably exhausts it and dies of some drive
  # (typically hunger) well inside maxRuntimeMinutes below, in any non-regressed build.
  # mean_lifespan_s (scripts/ci_regression_benchmark.py) needs creatures that actually
  # die - dl2l_data.extract's lifetime_s is NULL for one still alive at trial end.
  reposition = false
  maxRuntimeMinutes = 4

  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"

  worldSize = {
    width = 400, height = 400
  }

  # Same shape as src/test/resources/simulations/integration_single_creature.conf (issue
  # #85's Java integration-test world) - one creature, small enough to stay in near-
  # continuous sensory range, which is also the condition under which the pre-#85
  # detector-driven cycle inflation was most visible. Deliberately small/fast: this world
  # runs once per push to main, not as a scientific experiment.
  creatureSettings = [{
    quantity = 1
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 25
  }]

  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, RANDOM]
  }
}
