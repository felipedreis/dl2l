# p107 control: A2 with a table that never trains (docs/experiments/p107_ctl_recipe.md).
# focusThetaOn = 99 is above any drive level (levels peak near 7), so the focus tracker never opens an episode,
# no episode closes, and the operant table is never fed; the arbiter then chooses from the untrained prior.
# Everything else is A2 as in the pilot (p107_gate2_a2.conf).
include "arbiter_a2.conf"
simulation.learningSettings.focusThetaOn = 99.0
simulation.learningSettings.focusThetaOff = 0.15
