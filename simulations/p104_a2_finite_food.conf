# Issue #104 stress check: the A2 arbiter in a world with a finite food supply (no respawn), so creatures run out of
# food, drives climb to the lethal level and some creatures die: this exercises the death close-out of the episode
# buffer on a real run. 20 red + 20 green apples, 300 gray distractors.
include "p104_a2_check.conf"
simulation.maxRuntimeMinutes = 30
simulation.reposition = false
simulation.worldObjectSettings = [{
  objectType = "RED_APPLE"
  quantity = 20
}, {
  objectType = "GREEN_APPLE"
  quantity = 20
}, {
  objectType = "GRAY_APPLE"
  quantity = 300
}]
