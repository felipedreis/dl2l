# A0 — the baseline every arbiter arm derives from (issue #99; docs/plans/2026-q4-research-plan.md).
#
# This is the p84 legacy_nomem configuration: legacy-minimal stack (action tendency on;
# neuromodulation, expectancy, orexin and endocrine off), no MEMORY filter, replenishment on
# exactly as in p84, mixed world (Campos's 20/20/60 mix, where hunger binds). See
# simulations/p84_legacy_nomem.conf for the reasoning behind each choice.
#
# Arms derive from this file with an `include` and override one line, e.g. A1:
#
#   include "arbiter_a0.conf"
#   simulation.learningSettings.focalDriveEnabled = true
#
# No `seed` here on purpose: trial seeds come from the experiment spec's `seeds:` list (#95).
# focalDriveEnabled is false (the default): the filters see the per-cycle most-aroused emotion.

simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 120
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = true
  repositionDelaySeconds = 0

  creatureSettings = [{
    quantity = 5
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 100
  }, {
    objectType = "GREEN_APPLE"
    quantity = 100
  }, {
    objectType = "GRAY_APPLE"
    quantity = 300
  }]

  worldSize = {
    width = 1923, height = 1610
  }

  learningSettings {
    circadianEnabled       = false
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, RANDOM]
    expectancyEnabled      = false
    neuromodulationEnabled = false
    actionTendencyEnabled  = true
    orexinEnabled          = false
    endocrineEnabled       = false
    focalDriveEnabled      = false
  }
}
