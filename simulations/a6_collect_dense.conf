# JEPA collection run, density level 'dense' (docs/experiments/a6_collect_recipe.md): a3_kal in the plants world with the apples scaled
# to 100 red + 100 green + 300 gray (the plants world has 100 / 100 / 300); cactus and aloe unchanged (140 each). Exploration floor 0.15, the
# per-cycle transition log on, 60-minute cap. Sleep lock and action tendency off, as in p117_kalman.
include "p117_kal_a3_kal.conf"
simulation.worldObjectSettings = [
  { objectType = "RED_APPLE",   quantity = 100 },
  { objectType = "GREEN_APPLE", quantity = 100 },
  { objectType = "GRAY_APPLE",  quantity = 300 },
  { objectType = "CACTUS",      quantity = 140 },
  { objectType = "ALOE",        quantity = 140 }
]
simulation.learningSettings.transitionLoggingEnabled = true
simulation.learningSettings.arbiterEpsilon = 0.15
