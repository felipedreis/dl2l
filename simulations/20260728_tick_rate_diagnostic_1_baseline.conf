simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 18
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = false

  creatureSettings = [{
    quantity = 10
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 500
  }, {
    objectType = "GREEN_APPLE"
    quantity = 500
  }, {
    objectType = "GRAY_APPLE"
    quantity = 500
  }, {
    objectType = "CACTUS"
    quantity = 50
  }, {
    objectType = "ALOE"
    quantity = 100
  }]

  worldSize = {
    width = 1200, height = 900
  }

  # Throwaway diagnostic, NOT a scientific experiment: same dense/scarce world as
  # 20260717_memory_vs_wm_dense_scarce's condition 1 (baseline), only maxRuntimeMinutes
  # cut way down (60 -> 18) for fast iteration. Purpose: confirm the new
  # dl2l_creature_cognitive_cycles_total probe (+ JVM GC/CPU metrics) actually catch
  # the node-specific per-creature cycle-rate suppression found in that experiment
  # (some CCAD nodes showed ~6-8x fewer PartialAppraisal cycles than others for no
  # code-level reason — see docs/plans and the run history around 2026-07-27/28).
  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, RANDOM]
    expectancyEnabled      = true
    expectancyMode         = DISCRETE
    neuromodulationEnabled = true
    actionTendencyEnabled  = true
    orexinEnabled          = true
    endocrineEnabled       = true
  }
}
