simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 10
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  # Repositioning OFF, same as p59 calibration and the p79 tick-rate diagnostic, so this
  # run is directly comparable to both the pre-#76 baseline
  # (docs/reports/p59_batching_fix_report.md: ~150s lifespan) and the current-broken
  # measurement (docs/reports/p79_metabolic_clock_report.md: ~15-25s lifespan, S=4.286).
  reposition = false

  creatureSettings = [{
    quantity = 3
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 500
  }, {
    objectType = "GREEN_APPLE"
    quantity = 500
  }]

  worldSize = {
    width = 800, height = 600
  }

  # Issue #79 Phase A validation: Constants.java's metabolic/circadian/sleep rates were
  # rescaled by S=4.286 (measured cognitive-cycle throughput jump since #76/#78). Success
  # criteria: mean lifespan restored to ~150s (deaths from hunger, not sleep), and
  # cycles-per-lifetime comfortably above the pre-#76 baseline (~23,000-24,000).
  learningSettings {
    circadianEnabled       = true
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, MEMORY, RANDOM]
    expectancyEnabled      = true
    expectancyMode         = DISCRETE
    neuromodulationEnabled = true
    actionTendencyEnabled  = false
    orexinEnabled          = true
    endocrineEnabled       = true
  }
}
