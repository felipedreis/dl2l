# Issue #104 verification run (a smoke check, not a hypothesis test): A2 = the arbiter over the operant table.
# A0 with the focal drive and the operant estimator on, the action chosen by the arbiter, and enabledFilters
# reduced to TARGET_DISTANCE (the arbiter replaces the rest; see docs/plans/issue-104-arbitration-filter.md).
include "arbiter_a0.conf"
simulation.maxRuntimeMinutes = 15
simulation.learningSettings.focalDriveEnabled = true
simulation.learningSettings.operantEstimatorEnabled = true
simulation.learningSettings.actionSelector = ARBITER
simulation.learningSettings.enabledFilters = [TARGET_DISTANCE]
