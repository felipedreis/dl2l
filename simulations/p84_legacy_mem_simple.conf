# Behaviour parity with Mapa (2009) and Campos (2015) — issue #84.
#
# Replenishment is ON so that several creatures per trial sample in parallel rather than
# competing over a draining world; creatures cannot perceive each other, so there is no
# other coupling between them. Mapa ran without replenishment, but the quantity taken from
# her work is a foraging latency (how long to find and interact with the next object),
# which replenishment does not distort.
#
# World "simple": Red and green only. Every interaction regulates hunger, which is
# the condition Mapa credits for Silva's (2008) monotonically decreasing curve.
#
# Density is Campos's, held fixed as creatures scale: 500 objects in 1923x1610 px for
# 5 creatures = 6192 px^2 per object and 619,206 px^2 per
# creature (his: 6192 and 619,200).
#
# Arm legacy_mem_simple: legacy-minimal stack plus MEMORY. Engrams still FORM in the nomem
# arm (MemorySystemActor is unconditional, CreatureActor:132) — only their use
# differs, which makes formation a matched control across the pair.

simulation {
  holders = 1
  noUI = false
  # 30, not 120. Measured 2026-08-11: creatures in this arm are still alive at 95 minutes on the
  # reworked build — memory extends life enough that the arm no longer terminates on its own,
  # so a trial costs 3.6 GB and 16 of them cost 58 GB against a ~35 GB quota. It cannot be run
  # to the old cap at any concurrency.
  #
  # Capping right-censors these creatures rather than observing them to death, which
  # Kaplan-Meier and log-rank handle directly (see stats.survival_comparison). Nothing
  # claimable is lost: the arm's partner (legacy_nomem_simple / current_nomem) never dies at
  # ANY cap, so the pair's survival ratio was already uncomputable — issue #90. Diet
  # composition, calories per interaction and the selection-criterion shares are all rates and
  # are unaffected by the shorter window. The definitive survival result comes from the legacy
  # pair, which does terminate and is already collected at n=80 per arm.
  maxRuntimeMinutes = 30
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = true
  repositionDelaySeconds = 0

  creatureSettings = [{
    quantity = 5
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 250
  }, {
    objectType = "GREEN_APPLE"
    quantity = 250
  }]

  worldSize = {
    width = 1923, height = 1610
  }

  # Legacy-minimal: everything Mapa (2009) and Campos (2015) did not have is off, so a
  # mismatch against their figures is attributable to the core architecture rather than to
  # one of six later subsystems. No WORLD_MODEL either — neither source had one.
  #
  # actionTendency is ON: ActionTendencyFilter models Campos (2006) innate action tendencies
  # and its pass-through rule is taken from the 2015 paper itself, so it belongs to the
  # source architecture, not to the modern additions. (Earlier runs of this experiment had it
  # off, which wrongly removed a mechanism both sources had.) The modern substitute for it —
  # the neuromodulation layer — is off here and on in the current arms; docs/plans/
  # tedium-saturation.md measured the two as independently sufficient for tedium regulation,
  # which is what makes them comparable as a substitution rather than as an addition.
  learningSettings {
    circadianEnabled       = false
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, MEMORY, AFFORDANCE, RANDOM]
    expectancyEnabled      = false
    neuromodulationEnabled = false
    actionTendencyEnabled  = true
    orexinEnabled          = false
    endocrineEnabled       = false
  }
}
