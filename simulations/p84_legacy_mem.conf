# Behaviour parity with Mapa (2009) and Campos (2015) — issue #84.
#
# Replenishment is ON so that several creatures per trial sample in parallel rather than
# competing over a draining world; creatures cannot perceive each other, so there is no
# other coupling between them. Mapa ran without replenishment, but the quantity taken from
# her work is a foraging latency (how long to find and interact with the next object),
# which replenishment does not distort.
#
# World "mixed": Campos's 20/20/60 mix. GRAY_APPLE is caloricValue 0, so some
# interactions are unrewarding — the condition Mapa blames for her oscillating
# interval curve.
#
# Density is Campos's, held fixed as creatures scale: 500 objects in 1923x1610 px for
# 5 creatures = 6192 px^2 per object and 619,206 px^2 per
# creature (his: 6192 and 619,200).
#
# Arm legacy_mem: legacy-minimal stack plus MEMORY. Engrams still FORM in the nomem
# arm (MemorySystemActor is unconditional, CreatureActor:132) — only their use
# differs, which makes formation a matched control across the pair.

simulation {
  holders = 1
  noUI = false
  maxRuntimeMinutes = 90
  positionFactory = "br.cefetmg.lsi.l2l.world.RandomPositionFactory"
  reposition = true
  repositionDelaySeconds = 0

  creatureSettings = [{
    quantity = 5
  }]

  worldObjectSettings = [{
    objectType = "RED_APPLE"
    quantity = 100
  }, {
    objectType = "GREEN_APPLE"
    quantity = 100
  }, {
    objectType = "GRAY_APPLE"
    quantity = 300
  }]

  worldSize = {
    width = 1923, height = 1610
  }

  # Legacy-minimal: everything Mapa (2009) and Campos (2015) did not have is off, so a
  # mismatch against their figures is attributable to the core architecture rather than to
  # one of six later subsystems. No WORLD_MODEL either — neither source had one.
  learningSettings {
    circadianEnabled       = false
    consolidationEnabled   = false
    enabledFilters         = [TARGET_DISTANCE, AFFORDANCE, MEMORY, RANDOM]
    expectancyEnabled      = false
    neuromodulationEnabled = false
    actionTendencyEnabled  = false
    orexinEnabled          = false
    endocrineEnabled       = false
  }
}
