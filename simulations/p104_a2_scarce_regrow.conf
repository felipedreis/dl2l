# Issue #104 stress check: the A2 arbiter in a world where food is scarce and slow to come back, so that drives
# pass the focus tracker's opening level (2.0) and episodes actually open and close. 10 red + 10 green apples
# (the gray apples are the non-nutritive distractors, as in A0); an eaten apple respawns after 60 s.
include "p104_a2_check.conf"
simulation.maxRuntimeMinutes = 30
simulation.repositionDelaySeconds = 60
simulation.worldObjectSettings = [{
  objectType = "RED_APPLE"
  quantity = 10
}, {
  objectType = "GREEN_APPLE"
  quantity = 10
}, {
  objectType = "GRAY_APPLE"
  quantity = 300
}]
