# The harder world of the plants run (docs/experiments/p117_plants_recipe.md): the pilot world (100 red + 100 green + 300 gray apples,
# instant respawn) plus the plants, so the pain drive and its objects matter: CACTUS hurts, ALOE heals. Densities are the memory-vs-WM
# campaign's (50 cactus + 100 aloe on 1200 x 900) scaled to this map's area (1923 x 1610, about 2.9x): 140 each, rounded. Sleep hysteresis off
# (docs/plans/sleep-hysteresis-switch.md) and the innate action tendency lists off (actionTendencyEnabled = false: the arbiter chooses among
# every affordable action, with no hand-built emotion -> action prior). Included after an arm's own config, so it overrides it.
simulation.worldObjectSettings = [
  { objectType = "RED_APPLE",   quantity = 100 },
  { objectType = "GREEN_APPLE", quantity = 100 },
  { objectType = "GRAY_APPLE",  quantity = 300 },
  { objectType = "CACTUS",      quantity = 140 },
  { objectType = "ALOE",        quantity = 140 }
]
simulation.learningSettings.sleepHysteresisEnabled = false
simulation.learningSettings.actionTendencyEnabled = false
