name: Preview Image

# Publishes an image for a branch under active work, so an experiment run can point at it
# (via `-e dl2l_image=...`, see CLAUDE.md) without merging to main first. Mirrors cd.yml's
# publish job; differs only in trigger and tags. Never touches the `latest` tag cd.yml owns.
on:
  push:
    branches: ['preview/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: temurin
          cache: maven

      - name: Build fat jar
        run: |
          mvn package \
            -DskipTests \
            --no-transfer-progress

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # type=ref,event=branch replaces "/" with "-", so pushing to
            # preview/perception-flickering yields preview-perception-flickering with no
            # extra prefix needed.
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
