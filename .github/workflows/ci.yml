name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Split from a single "test" job (issue #85 follow-up) so a slow/flaky integration run
  # shows as its own row in the PR checks list instead of masking the fast unit/functional
  # signal. Convention: any test class ending in "IntegrationTest" (see
  # src/test/java/br/cefetmg/lsi/l2l/integration/) is picked up by integration-tests and
  # excluded from unit-tests - keep new integration tests on that suffix.
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: temurin
          cache: maven

      - name: Run unit/functional tests
        # ConsolidationPipelineTest downloads PyTorch native libs at runtime and requires
        # network access to the DJL model hub; excluded here to keep CI hermetic.
        run: |
          mvn test \
            -Dtest='!ConsolidationPipelineTest,!*IntegrationTest' \
            --no-transfer-progress

  integration-tests:
    runs-on: ubuntu-latest
    # These boot a real Akka ActorSystem per class (SimulationIntegrationHarness) and run
    # the simulation for bounded wall-clock windows - normally ~3 minutes total, but a
    # regression that hangs the scheduler shouldn't be able to hang the whole PR check.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: temurin
          cache: maven

      - name: Run integration tests
        run: |
          mvn test \
            -Dtest='*IntegrationTest' \
            --no-transfer-progress
