# Campos et al. (2015) Fig. 5/6 replication — issue #84.
#
# Cumulative count of selected actions per selection criterion, over the lifetime and
# zoomed to the first 1000 interactions, with and without the episodic memory filter.
# Also carries the quantitative survival claim: Campos reports a mean lifetime of
# 1.4e4 s with memory against 2.1e3 s without, a 6.7x ratio.
#
# `trials` is set from the pilot's power analysis and capped at his 50 realizations —
# see docs/plans/behaviour-parity-legacy-architectures.md §5. It starts at 50 (his
# number) and is only reduced if the pilot shows the run-to-death arms are too slow;
# reducing n is preferred over capping runtime, since a censored lifetime would corrupt
# the survival comparison.
#
# current_mem_consol is an extension arm, not part of any parity claim — neither source
# architecture had sleep consolidation. It sits outside the within-pair comparisons
# (legacy_mem vs legacy_nomem, current_mem vs current_nomem) so it cannot confound them.

name: p84_campos_selection_criteria
trials: 50

conditions:
  - key: legacy_nomem
    simulation: simulations/p84_campos_legacy_nomem.conf
    label: Legacy
    color: "#bdbdbd"
  - key: legacy_mem
    simulation: simulations/p84_campos_legacy_mem.conf
    label: Legacy+Mem
    color: "#5c85d6"
  - key: current_nomem
    simulation: simulations/p84_campos_current_nomem.conf
    label: Current
    color: "#9e9e9e"
  - key: current_mem
    simulation: simulations/p84_campos_current_mem.conf
    label: Current+Mem
    color: "#2b5eb8"
  - key: current_mem_consol
    simulation: simulations/p84_campos_current_mem_consol.conf
    label: Current+Mem+Consol
    color: "#7b2d8b"

# CCAD has no local docker daemon — images come from GHCR only.
image:
  source: registry

data_dir: ml/data_p84_campos_selection_criteria

extract:
  format: parquet
  backup: true
  tables: all

upload:
  enabled: true
  repo: felipedreis/dl2l-experiments
  prefix: p84

analysis:
  module: p84_campos_selection_criteria
