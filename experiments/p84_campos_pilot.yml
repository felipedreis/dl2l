# Local pilot for p84_campos_selection_criteria — issue #84.
#
# Same five arms and the same simulations/p84_campos_*.conf as the campaign, at 2 trials.
# Beyond the schema checks it shares with p84_mapa_pilot, this one exists to answer the
# two questions that size the campaign:
#   * how long does a run-to-death trial actually take here? Campos reports a mean lifetime
#     of 1.4e4 s with memory, and 50 trials x 5 arms of that is not obviously affordable;
#   * what is the variance of the P2 statistic (the RANDOM curve's late/early slope ratio)
#     and of lifetime? Those feed the two-sample power calculation (alpha 0.05, power 0.8)
#     that sets the campaign's `trials`, capped at Campos's 50.
# It also confirms current_mem_consol produces non-empty memory_traces / consolidation_* — the
# only arm that can.
#
# upload.enabled is false because this is a throwaway smoke run, which is the documented
# exception in experiments/README.md — never do this for a real experiment.
# image.source is build (not registry): the pilot must exercise the local Java changes.

name: p84_campos_pilot
trials: 2

conditions:
  - key: legacy_nomem
    simulation: simulations/p84_campos_legacy_nomem.conf
    label: Legacy
    color: "#bdbdbd"
  - key: legacy_mem
    simulation: simulations/p84_campos_legacy_mem.conf
    label: Legacy+Mem
    color: "#5c85d6"
  - key: current_nomem
    simulation: simulations/p84_campos_current_nomem.conf
    label: Current
    color: "#9e9e9e"
  - key: current_mem
    simulation: simulations/p84_campos_current_mem.conf
    label: Current+Mem
    color: "#2b5eb8"
  - key: current_mem_consol
    simulation: simulations/p84_campos_current_mem_consol.conf
    label: Current+Mem+Consol
    color: "#7b2d8b"

image:
  source: build

data_dir: ml/data_p84_campos_pilot

extract:
  format: parquet
  backup: false
  tables: all

upload:
  enabled: false

analysis:
  module: p84_campos_selection_criteria
