# Local pilot of p117_kalman (docs/experiments/p117_kalman_recipe.md, section 8): the same four arms and the first six seeds of p117_factorial, with a
# 20-minute cap instead of 60 and six trials instead of twelve, run sequentially on a laptop. A pilot, not the powered run: the survival
# curves are censored at 20 minutes and n = 6 per arm.
name: p117_kalman_local
trials: 6
seeds: [10900, 10901, 10902, 10903, 10904, 10905]
conditions:
- {key: a3_base, simulation: simulations/p117_kal_local_a3_base.conf, label: 'A3 (control)', color: '#2a78d6'}
- {key: a3_mc,   simulation: simulations/p117_kal_local_a3_mc.conf,   label: 'A3 + APPROACH credit', color: '#6250d6'}
- {key: a3_kal,  simulation: simulations/p117_kal_local_a3_kal.conf,  label: 'A3 + APPROACH credit + Kalman operant', color: '#eb6834'}
- {key: a3_all,  simulation: simulations/p117_kal_local_a3_all.conf,  label: 'A3 + all three (+ whole-draw stop rule)', color: '#1baf7a'}
image:
  source: build
data_dir: ml/data_p117_kalman_local
extract: {format: parquet, backup: false, tables: all}
upload: {enabled: true, prefix: p117_kalman_local}
analysis: {module: arbiter_ladder}
