# Local pilot for p84_mapa_interaction_interval — issue #84.
#
# Same four arms and the same simulations/p84_mapa_*.conf as the campaign, at 2 trials, to
# validate end-to-end before committing the campaign to CCAD:
#   * conditioning.parquet and memory_decisions.parquet exist and are non-empty;
#   * conditioning rows appear in the L_* arms (proves the legacy Valuation call site fires
#     — those arms have expectancy off and write no ExpectancyState);
#   * memory_decisions rows are ABSENT from the *_nomem arms (proves the filter really is
#     out of the chain) and present in the *_mem arms;
#   * engrams rows appear in the *_nomem arms too (confirms the matched-formation control);
#   * every arm reaches >= 10 EAT interactions well inside maxRuntimeMinutes, else the
#     world is too sparse and both worlds get shrunk by the same factor to preserve the
#     density match.
#
# upload.enabled is false because this is a throwaway smoke run, which is the documented
# exception in experiments/README.md — never do this for a real experiment.
# image.source is build (not registry): the pilot must exercise the local Java changes.

name: p84_mapa_pilot
trials: 2

conditions:
  - key: legacy_nomem
    simulation: simulations/p84_mapa_legacy_nomem.conf
    label: Legacy
    color: "#bdbdbd"
  - key: legacy_mem
    simulation: simulations/p84_mapa_legacy_mem.conf
    label: Legacy+Mem
    color: "#5c85d6"
  - key: current_nomem
    simulation: simulations/p84_mapa_current_nomem.conf
    label: Current
    color: "#9e9e9e"
  - key: current_mem
    simulation: simulations/p84_mapa_current_mem.conf
    label: Current+Mem
    color: "#2b5eb8"

image:
  source: build

data_dir: ml/data_p84_mapa_pilot

extract:
  format: parquet
  backup: false
  tables: all

upload:
  enabled: false

analysis:
  module: p84_mapa_interaction_interval
