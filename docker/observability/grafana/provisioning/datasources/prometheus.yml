apiVersion: 1

# Processed before `datasources` below. Required because pinning the uid on a stack whose
# grafana volume already holds a Prometheus datasource under an auto-generated uid makes
# Grafana fail provisioning outright ("Datasource provisioning error: data source not
# found") and exit 1 — it will not rewrite an existing datasource's uid. Deleting by name
# first lets the pinned-uid entry be created cleanly on old and fresh volumes alike.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned, not auto-generated. Dashboards reference a datasource by *uid*, and
    # dl2l-overview.json hardcodes "Prometheus". Without this line Grafana assigns a
    # random uid (PBFA97CFB590B2093 on one local stack), every panel resolves to a
    # datasource that does not exist, and the whole dashboard renders empty.
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
