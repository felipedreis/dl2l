version: "3.1"
services:
  dl2l-manager:
    image: dl2l
    environment:
      ROLE: "manager,idProvider"
      SIMULATION: "simulations/baseline_1node_1creature.conf"
      HOST: "dl2l-manager"
      PORT: 2551
      TRIAL_ID: ${TRIAL_ID:-local}
    ports:
      - "9091:9091"
    networks:
      - dl2l-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "dl2l-manager", "2551" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - source: ../config/docker-config.conf
        target: /config/docker-config.conf
        read_only: true
        type: bind

  dl2l-detector:
    image: dl2l
    depends_on:
      dl2l-manager:
        condition: service_healthy
    environment:
      ROLE: "collisionDetector"
      SIMULATION: "simulations/baseline_1node_1creature.conf"
      HOST: "dl2l-detector"
      PORT: 2551
      TRIAL_ID: ${TRIAL_ID:-local}
    ports:
      - "8090:8080"
      - "9092:9091"
    networks:
      - dl2l-network
    volumes:
      - source: ../config/docker-config.conf
        target: /config/docker-config.conf
        read_only: true
        type: bind

  dl2l-holder:
    image: dl2l
    depends_on:
      dl2l-manager:
        condition: service_healthy
      dl2l-detector:
        condition: service_started
    environment:
      ROLE: "holder"
      SIMULATION: "simulations/baseline_1node_1creature.conf"
      HOST: "dl2l-holder"
      PORT: "2551"
      TRIAL_ID: ${TRIAL_ID:-local}
    ports:
      - "9093:9091"
    networks:
      - dl2l-network
    volumes:
      - source: ../config/docker-config.conf
        target: /config/docker-config.conf
        read_only: true
        type: bind
      # Heap dump + GC log on OOM (see scripts/run-dl2l.sh, docs/plans/issue-77-bdactor-oom-fix.md)
      # - dl2l-holder is the role that crashed under issue #77's sustained-load repro.
      - source: ../heapdumps
        target: /dl2l/heapdumps
        type: bind
      # Embedded DuckDB file + the raw-table Parquet dump BDActor writes at trial shutdown
      # (DATA_DIR="/dl2l/data" - see docker/Dockerfile, PersistenceExtension.configure()).
      # Replaces the old dl2l-db Postgres service entirely - see docs/plans/parquet-write-path.md.
      - source: ../data/raw
        target: /dl2l/data
        type: bind

  prometheus:
    image: prom/prometheus
    depends_on:
      - dl2l-manager
    volumes:
      - source: ./observability/prometheus-local.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        type: bind
      - dl2l-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dl2l-network

  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        type: bind
      - source: ./observability/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        type: bind
      - dl2l-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - dl2l-network

networks:
  dl2l-network:
    driver: bridge

volumes:
  dl2l-prometheus-data:
  dl2l-grafana-data: