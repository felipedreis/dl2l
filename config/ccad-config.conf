object-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"

  # parallelism-max is env-tunable without a rebuild (docs/plans/arrow-ipc-write-path.md,
  # W5b) - ${?VAR} is a HOCON optional override: a no-op when DL2L_OBJECT_PARALLELISM_MAX is
  # unset, so the literal default below is unchanged everywhere it isn't set.
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 20
    parallelism-max = ${?DL2L_OBJECT_PARALLELISM_MAX}
  }
  throughput = 10
}

bd-dispatcher {
  type = PinnedDispatcher
  mailbox-type = "br.cefetmg.lsi.l2l.common.ComponentMailbox"
  executor = "thread-pool-executor"

  # See src/main/resources/application.conf and docs/plans/issue-77-bdactor-oom-fix.md.
  max-batch-size = 500
  max-states-per-batch = 8192
}

wm-dispatcher {
  type = PinnedDispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 1
  }
}

collision-dispatcher {
  mailbox-type = "br.cefetmg.lsi.l2l.cluster.CollisionDetectorPriorityMailbox"

  # docs/plans/arrow-ipc-write-path.md, W5b: previously configured only the priority
  # mailbox and silently inherited actor.default-dispatcher's fork-join settings - explicit
  # now, sized the same as cluster-dispatcher below.
  #
  # CONFIRMED LIVE (docs/reports/arrow_ipc_write_path_validation_report.md): a flat
  # fixed-pool-size=2 shared by every environment measurably shortened local creature
  # lifetimes (~4%, p=0.0087) since local/docker dev has no cpuset contention to isolate
  # from. 4 is the safer non-CCAD default; run_trial.sh.j2 pins CCAD back down to a
  # tight, explicitly-budgeted value via DL2L_COLLISION_DISPATCHER_POOL_SIZE, matching
  # W5b's per-role CPU accounting intent (this file is CCAD-specific, so that override
  # is expected to always be set here in practice).
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 4
    fixed-pool-size = ${?DL2L_COLLISION_DISPATCHER_POOL_SIZE}
  }
}

# docs/plans/arrow-ipc-write-path.md, W5b: dedicated fixed-size pool for SimulationManager
# and Holder (see Main.java) - isolates cluster liveness (handshakes/heartbeats/the Finish
# protocol) from creature-load contention under a controlled cpuset (CCAD).
cluster-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 4
    fixed-pool-size = ${?DL2L_CLUSTER_DISPATCHER_POOL_SIZE}
  }
}

component-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"

  # Explicit, CPU-bound-appropriate sizing. Left unset, this silently inherited
  # akka.actor.default-dispatcher's fork-join defaults (parallelism-factor = 3.0,
  # tuned for I/O-bound dispatchers) - on CCAD's 6-CPU-per-trial cgroup slice that
  # computed to 18 worker threads per JVM role, confirmed live via thread dump and
  # the JVM's own system_cpu_count=6 metric. PartialAppraisal/HomeostaticRegulation/
  # Valuation/EmotionalSystemActor/MemorySystemActor/OperantConditioningActor etc. do
  # no I/O blocking in their hot path, so 3x oversubscription only added contention,
  # compounding across 3 JVM roles x up to 5 co-located trials per CCAD node into
  # bursty scheduling stalls (see docs/plans/ccad-dispatcher-parallelism-fix.md). This
  # was the config actually live for every CCAD trial ($CONFIG_BIND mounts this file
  # to /config/docker-config.conf) — the environment the stalls were observed in.
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 1.0
    parallelism-max = 6
    parallelism-max = ${?DL2L_COMPONENT_PARALLELISM_MAX}
  }
  mailbox-type = "br.cefetmg.lsi.l2l.common.ComponentMailbox"
}

akka.actor.deployment {
  "/holder/object-*" {
    dispatcher = object-dispatcher
  }
}


akka {
  # CONFIRMED LIVE: DEBUG (copied verbatim from docker-config.conf) floods
  # ~/.singularity/instances/logs/*/*/dl2l-*.{out,err} with akka gossip/
  # heartbeat/serialization-warning noise — one such log accumulated 240MB+
  # across a single session. Unlike local/Pi docker logs (local disk), these
  # are on CCAD's NFS-mounted $HOME, so every DEBUG line written there is
  # network I/O. INFO keeps SimulationManager's own completion-detection
  # messages (run_trial.sh.j2 greps manager's log for "Maximum runtime
  # reached"/"All creatures dead") working — do not go below INFO here.
  loglevel = "INFO"

  actor {
    #provider = "akka.cluster.ClusterActorRefProvider"
    provider = "cluster"
    guardian-supervisor-strategy = "akka.actor.StoppingSupervisorStrategy"
  }

  # Left unconfigured, this used Akka's built-in fork-join defaults
  # (parallelism-factor = 3.0, tuned for I/O-bound work) - on CCAD's 6-CPU-per-trial
  # cgroup slice that computed to 18 worker threads per JVM role, confirmed live via
  # thread dump. See component-dispatcher above and
  # docs/plans/ccad-dispatcher-parallelism-fix.md for the full investigation. Kept a
  # bit more headroom here than component-dispatcher since this pool also serves
  # cluster/remote/system machinery.
  actor.default-dispatcher {
    fork-join-executor {
      parallelism-min = 2
      parallelism-factor = 1.0
      parallelism-max = 8
      parallelism-max = ${?DL2L_DEFAULT_PARALLELISM_MAX}
    }
  }
  remote {
    artery {
      enabled = false  # Since you're using classic remoting
    }
    netty.tcp {
      hostname = ${HOST}
      port = ${PORT}
      bind-hostname = ${HOST} #0.0.0.0 # Allow external connections
      bind-port = ${PORT}
    }
    log-remote-lifecycle-events = on
    use-passive-connections = off
  }

  cluster {
    # CCAD's Singularity instances share the allocated node's network
    # namespace (no per-container hostnames/DNS like Docker's bridge
    # network), so every role uses HOST=localhost with a distinct PORT
    # instead of a container-name seed address.
    #
    # CONFIRMED LIVE (2026-07-16): this used to hardcode :2551 for
    # manager's port, safe only when every trial on the cluster used the
    # same fixed ports — broke once concurrent trials landed on the same
    # node (short_qos's CPU grant allows far more parallelism than
    # originally assumed: up to 9 trials observed live on one 56-CPU
    # node) and needed distinct ports to avoid colliding. ${SEED_PORT} is
    # now set per-trial by run_trial.sh.j2 (always equal to that trial's
    # own manager port) and passed to manager/detector/holder alike, so
    # detector/holder find THIS trial's manager specifically, not
    # whichever one last happened to bind 2551.
    seed-nodes = [
      "akka.tcp://l2l@localhost:"${SEED_PORT},
    ]
    min-nr-of-members = 2
  }
  version = 2.5.32
}
